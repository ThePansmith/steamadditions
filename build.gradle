plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
    id "maven-publish"
    id "idea"
    id 'java-library'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
mod_id = project.mod_id
mod_author = project.mod_author
group = project.maven_group

def modId = project.mod_id
def generatedResources = file("src/generated/resources")

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.parchment_mappings
        minecraftVersion = project.minecraft_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.main
        }
        server {
            server()
            sourceSet = sourceSets.main
        }
        data {
            data()
            sourceSet = sourceSets.main
            gameDirectory.set(file('run/data'))
            programArguments.addAll "--all", "--mod", modId, "--output", generatedResources.getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
            programArguments.addAll "--existing-mod", "gtceu"
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

}

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url "https://maven.latvian.dev/releases/"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.jozufozu.flywheel")
            includeGroup("com.tterrag.registrate")
            includeGroup("com.simibubi.create")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // FTB Mods
        url "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.latvian.dev/snapshots"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.ftb.dev/snapshots"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    exclusiveContent { // Configuration
        forRepositories(
                maven { url = "https://repo.repsy.io/mvn/toma/public/" },
                maven { url = "https://api.repsy.io/mvn/toma/public" },
        )
        filter { includeGroup("dev.toma.configuration")}
    }
}

dependencies {
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-forge-api:${project.jei_version}") { transitive = false }
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") { transitive = false }

    modImplementation("com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}") { transitive = false }
    modImplementation("brachy.modularui:modularui-mc${project.minecraft_version}:${mui_version}:slim") { transitive = false }
    modImplementation("dev.toma.configuration:configuration-${project.minecraft_version}:${configuration_version}")
    modRuntimeOnly("io.github.llamalad7:mixinextras-forge:${project.mixinextra_version}")
    modRuntimeOnly("io.github.llamalad7:mixinextras-common:${project.mixinextra_version}")

    modImplementation("com.tterrag.registrate:Registrate:${project.registrate_version}")
    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}

processResources {
    // define properties that can be used during resource processing
    inputs.property "version", version

    filesMatching("META-INF/mods.toml") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release = 17
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

jar {
    // add some additional metadata to the jar manifest
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_author,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// configure the maven publication
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}